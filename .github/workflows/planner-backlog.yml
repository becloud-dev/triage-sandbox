# Consumer caller for the backlog planner probe. Copy to .github/workflows/planner-backlog.yml
# in the sandbox repository (becloud-dev/triage-sandbox) and commit it to the default branch.
name: planner-backlog

on:
  workflow_dispatch:

jobs:
  planner-backlog:
    concurrency:
      group: planner-backlog
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    uses: becloud-dev/workflows/.github/workflows/planner-backlog.yml@main
    with:
      model: claude-haiku-5-5
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
